name: Build NEXORA Client 2.0 for Fabric 1.21.10
on:
  push:
    branches: [chatgpt/nexora-client-2-build]
    paths:
      - 'nexora-build/**'
      - '.github/workflows/build-nexora.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Reconstruct NEXORA source
        run: bash nexora-build/prepare.sh
      - name: Build main NEXORA mod with real Minecraft and Fabric
        working-directory: /tmp/nexora-client
        run: gradle --no-daemon clean build --stacktrace
      - name: Build 3D ESP and inventory modules with real Minecraft and Fabric
        working-directory: /tmp/nexora-client/glow
        run: gradle --no-daemon clean build --stacktrace
      - name: Merge and verify production jar
        shell: bash
        run: |
          set -euo pipefail
          MAIN=$(find /tmp/nexora-client/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)
          VISUAL=$(find /tmp/nexora-client/glow/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)
          test -s "$MAIN" && test -s "$VISUAL"
          mkdir -p /tmp/nexora-mix
          (cd /tmp/nexora-mix && unzip -q "$VISUAL" 'net/nexora/client/WorldGlowRenderer*.class' 'net/nexora/client/NexoraFeatures*.class')
          cp "$MAIN" /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar
          (cd /tmp/nexora-mix && find net/nexora/client -type f -name '*.class' -print0 | xargs -0 jar uf /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar)
          unzip -l /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar | grep -q 'net/nexora/client/NexoraClient.class'
          unzip -l /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar | grep -q 'net/nexora/client/WorldGlowRenderer.class'
          unzip -l /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar | grep -q 'net/nexora/client/NexoraFeatures.class'
          unzip -p /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar fabric.mod.json | grep -q 'NEXORA Client'
          unzip -p /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar fabric.mod.json | grep -q '2.0.0'
          ls -lh /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Client-2.0.0
          path: /tmp/NEXORA-Client-2.0.0-Fabric-1.21.10.jar
          if-no-files-found: error
