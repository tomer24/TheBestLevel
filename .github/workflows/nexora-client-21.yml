name: NEXORA Client 2.1 Real Fabric Build
on:
  push:
    branches: [chatgpt/nexora-client-2-1-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Extract genuine source and uploaded logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexora21
          base64 -d nexora-build/source-2.1.b64 > /tmp/nexora-source.zip
          unzip -oq /tmp/nexora-source.zip -d /tmp/nexora21
          test -s /tmp/nexora21/src/main/resources/assets/nexora/icon.png
          test -s /tmp/nexora21/src/main/java/net/nexora/client/ModHubScreen.java
          grep -q '^mod_version=2.1.0' /tmp/nexora21/gradle.properties
          sed -i 's/private static double heuristic(int x,int z,int gx,int gz)/private static double heuristic(double x,double z,double gx,double gz)/' /tmp/nexora21/src/main/java/net/nexora/client/BuiltInNavigator.java
      - name: Compile Fabric NEXORA core
        working-directory: /tmp/nexora21
        run: gradle --no-daemon clean build --stacktrace
      - name: Compile official-mapped renderer and module handlers
        working-directory: /tmp/nexora21/glow
        run: gradle --no-daemon clean build --stacktrace
      - name: Merge verified remapped classes into release jar
        shell: bash
        run: |
          set -euo pipefail
          CORE=$(find /tmp/nexora21/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)
          RENDER=$(find /tmp/nexora21/glow/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)
          test -s "$CORE"
          test -s "$RENDER"
          mkdir -p /tmp/nexora21-merge
          (cd /tmp/nexora21-merge && unzip -q "$RENDER" 'net/nexora/client/WorldGlowRenderer.class' 'net/nexora/client/NexoraFeatures.class')
          cp "$CORE" "$GITHUB_WORKSPACE/NEXORA-Client-2.1.0-Fabric-1.21.10.jar"
          (cd /tmp/nexora21-merge && jar uf "$GITHUB_WORKSPACE/NEXORA-Client-2.1.0-Fabric-1.21.10.jar" net/nexora/client/WorldGlowRenderer.class net/nexora/client/NexoraFeatures.class)
          jar tf "$GITHUB_WORKSPACE/NEXORA-Client-2.1.0-Fabric-1.21.10.jar" | grep -q 'net/nexora/client/ModHubScreen.class'
          jar tf "$GITHUB_WORKSPACE/NEXORA-Client-2.1.0-Fabric-1.21.10.jar" | grep -q 'net/nexora/client/WorldGlowRenderer.class'
          jar tf "$GITHUB_WORKSPACE/NEXORA-Client-2.1.0-Fabric-1.21.10.jar" | grep -q 'assets/nexora/icon.png'
          unzip -p "$GITHUB_WORKSPACE/NEXORA-Client-2.1.0-Fabric-1.21.10.jar" fabric.mod.json | grep -q 'NEXORA Client'
          ls -lh "$GITHUB_WORKSPACE/NEXORA-Client-2.1.0-Fabric-1.21.10.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Client-2.1.0-jar
          path: NEXORA-Client-2.1.0-Fabric-1.21.10.jar
          if-no-files-found: error
