name: Build Tomer Mod Hub Fabric JAR
on:
  push:
    branches: [chatgpt/tomer-modhub-fabric-build]
    paths:
      - 'modhub-build/TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Reconstruct and upgrade Fabric mod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tomer-modhub
          cat modhub-build/payload{1,2,3,4}.b64 | base64 --decode | tar -xz -C /tmp/tomer-modhub
          SRC=/tmp/tomer-modhub/src/main/java/dev/tomer/modhub
          for FILE in TomerModHub.java ChestEspOverlay.java BuiltInNavigator.java ModHubScreen.java; do
            test -s "modhub-build/overrides/$FILE"
            cp "modhub-build/overrides/$FILE" "$SRC/$FILE"
          done
          sed -i 's/mod_version=1.2.0/mod_version=1.3.0/' /tmp/tomer-modhub/gradle.properties
          sed -i 's/Baritone coordinate navigator, and chest ESP./self-contained walking and colored ESP for chests, ender chests, shulkers, and torches./' /tmp/tomer-modhub/src/main/resources/fabric.mod.json
          test -f /tmp/tomer-modhub/src/main/resources/fabric.mod.json
      - name: Build with real Minecraft and Fabric
        working-directory: /tmp/tomer-modhub
        run: gradle --no-daemon clean build --stacktrace
      - name: Validate and copy jar
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find /tmp/tomer-modhub/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)
          test -n "$JAR"
          unzip -l "$JAR" | grep -q 'fabric.mod.json'
          unzip -l "$JAR" | grep -q 'dev/tomer/modhub/TomerModHub.class'
          unzip -l "$JAR" | grep -q 'dev/tomer/modhub/BuiltInNavigator.class'
          unzip -l "$JAR" | grep -q 'dev/tomer/modhub/ChestEspOverlay.class'
          cp "$JAR" /tmp/hub.jar
      - uses: actions/upload-artifact@v4
        with:
          name: hub-v1.3-jar
          path: /tmp/hub.jar
          if-no-files-found: error
